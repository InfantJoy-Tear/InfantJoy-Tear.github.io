<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | 田文课题组</title>
  <style>
    :root { --ink:#102033; --muted:#5b6776; --soft:#f5f7fa; --paper:#fff; --line:#dbe2ea; --navy:#17395c; --teal:#1e6f70; --shadow:0 18px 46px rgba(16,32,51,.08); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--soft); font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif; letter-spacing:0; }
    a { color:inherit; text-decoration:none; }
    .site-header { border-bottom:1px solid var(--line); background:#fff; }
    .nav { display:flex; align-items:center; justify-content:space-between; gap:24px; width:min(980px, calc(100% - 40px)); min-height:68px; margin:0 auto; }
    .brand { display:grid; gap:2px; }
    .brand strong { font-size:18px; }
    .brand span { color:var(--muted); font-size:12px; }
    .nav-links { display:flex; gap:22px; color:#2c3d50; font-size:14px; font-weight:800; }
    .nav-links a:hover { color:var(--teal); }
    .hero-band { background:linear-gradient(135deg,var(--navy),var(--teal)); color:#fff; }
    .hero { width:min(980px, calc(100% - 40px)); margin:0 auto; padding:62px 0 54px; }
    .eyebrow { margin:0 0 14px; color:#cde8e3; font-size:13px; font-weight:900; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,6vw,58px); line-height:1.1; letter-spacing:0; }
    .page { width:min(980px, calc(100% - 40px)); margin:0 auto; padding:42px 0 78px; }
    .back { display:inline-flex; margin-bottom:24px; color:var(--teal); font-size:14px; font-weight:900; }
    article { padding:34px; border:1px solid var(--line); border-radius:8px; background:var(--paper); box-shadow:var(--shadow); }
    .content { color:var(--muted); font-size:16px; line-height:1.9; }
    .content h2 { margin:30px 0 12px; color:var(--ink); font-size:24px; }
    .content p { margin:0 0 16px; }
    .content ul, .content ol { margin:0 0 18px; padding-left:22px; }
    .content li { margin:6px 0; }
    .content img { max-width:100%; border-radius:8px; }
    @media (max-width:760px) { .nav { align-items:flex-start; flex-direction:column; padding:16px 0; } .nav-links { flex-wrap:wrap; gap:14px; } article { padding:22px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="/"><strong>田文课题组</strong><span>Nanjing University of Information Science &amp; Technology</span></a>
      <div class="nav-links">
        <a href="/">首页</a>
        <a href="/research/">研究方向</a>
        <a href="/research/covert-communication/">隐蔽通信</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="hero-band">
      <div class="hero">
        <p class="eyebrow">Covert Communication</p>
        <h1>{{ .Title }}</h1>
      </div>
    </section>
    <section class="page">
      <a class="back" href="/research/covert-communication/">返回隐蔽通信</a>
      <article>
        <div class="content">{{ .Content }}</div>
      </article>
    </section>
  </main>
</body>
</html>
