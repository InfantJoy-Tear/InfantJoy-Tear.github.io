<!doctype html>
<html lang="{{ .Site.Language.Lang | default "zh-CN" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | 课题组研究方向</title>
  <style>
    :root {
      --ink: #152033;
      --muted: #5f6b7a;
      --line: #d9e0e8;
      --paper: #ffffff;
      --wash: #f6f8fb;
      --accent: #1f6f8b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(228, 238, 232, 0.9), rgba(248, 224, 234, 0.72)),
        var(--wash);
      letter-spacing: 0;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(860px, calc(100% - 40px));
      margin: 0 auto;
      padding: 84px 0 70px;
    }

    .back {
      display: inline-flex;
      margin-bottom: 44px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .panel {
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 18px 45px rgba(21, 32, 51, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .lede {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .content {
      margin-top: 28px;
      color: var(--muted);
      line-height: 1.85;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="{{ "/research/" | relURL }}">返回课题组研究方向</a>
    <section class="panel">
      <h1>{{ .Title }}</h1>
      <p class="lede">该研究方向页面已预留，后续可添加课题介绍、代表论文、项目进展与成员信息。</p>
      {{ with .Content }}
        <div class="content">{{ . }}</div>
      {{ end }}
    </section>
  </main>
</body>
</html>
